services:
  db:
    image: docker.io/library/postgres:18-alpine
    container_name: iterum_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: iterum
      POSTGRES_PASSWORD: iterum
      POSTGRES_DB: iterum
    ports:
      - "5432:5432"
    volumes:
      - iterum_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iterum -d iterum"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  iterum_pg: